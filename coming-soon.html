<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today Would Be Nice</title>
  <meta name="description" content="Today Would Be Nice — Design Studio, Lahore. Coming Soon.">
  <link rel="icon" type="image/svg+xml" href="./assets/twbn-emblem.svg">

  <meta property="og:title" content="Today Would Be Nice — Coming Soon">
  <meta property="og:description" content="Today Would Be Nice — Design Studio, Lahore. Coming Soon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://todaywouldbenice.co">
  <meta property="og:image" content="https://todaywouldbenice.co/assets/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://todaywouldbenice.co/assets/og-image.svg">

  <!-- Pre-establish CDN connection for the shader -->
  <link rel="preconnect" href="https://esm.sh">

  <!-- Preload critical above-the-fold assets -->
  <link rel="preload" href="./assets/twbn-logo-full.svg" as="image" type="image/svg+xml">
  <link rel="preload" href="./typography/twbn-inktrap.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./assets/paper.jpg" as="image" type="image/jpeg">

  <style>
    @font-face {
      font-family: 'TWBN-Inktrap';
      src: url('./typography/twbn-inktrap.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: #ffffff;
      color: #191917;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    img, svg { display: block; max-width: 100%; }
    ::selection { background: #191917; color: #ffffff; }

    #paper-bg {
      position: fixed;
      inset: 0;
      background: #ffffff url('./assets/paper.jpg') center/cover no-repeat;
      opacity: 0.8;
      z-index: 0;
    }

    #grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.8;
    }

    #grain-overlay canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(40px, 7vw, 96px) clamp(24px, 6vw, 80px);
    }

    .cs-logo {
      width: clamp(180px, 44vw, 640px);
      height: auto;
    }

    .cs-headline {
      font-family: 'TWBN-Inktrap', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(52px, 11vw, 172px);
      line-height: 0.9;
      letter-spacing: -0.025em;
      text-align: center;
      color: #191917;
    }

    .cs-handle {
      font-family: 'TWBN-Inktrap', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(18px, 2.5vw, 21px);
      letter-spacing: 0.14em;
      color: #191917;
    }
  </style>
</head>
<body>

  <div id="paper-bg"></div>
  <div id="grain-overlay"></div>

  <div class="page">
    <img
      src="./assets/twbn-logo-full.svg"
      class="cs-logo"
      alt="Today Would Be Nice"
      fetchpriority="high"
      width="640"
      height="53"
    >
    <h1 class="cs-headline">coming soon</h1>
    <a
      href="https://www.instagram.com/todaywouldbenice"
      class="cs-handle"
      target="_blank"
      rel="noopener noreferrer"
    >@todaywouldbenice</a>
  </div>

  <script type="module">
    import {
      ShaderMount,
      grainGradientFragmentShader,
      getShaderColorFromString,
      getShaderNoiseTexture,
      GrainGradientShapes,
    } from 'https://esm.sh/@paper-design/shaders@0.0.76';

    const noiseTexture = getShaderNoiseTexture();
    const colorsRaw = ['#000000', '#000000', '#000000', '#000000'];
    const colorVecs = [
      ...colorsRaw.map(c => getShaderColorFromString(c)),
      ...Array(7 - colorsRaw.length).fill([0, 0, 0, 0]),
    ];
    const uniforms = {
      u_noiseTexture: noiseTexture,
      u_colorBack: getShaderColorFromString('#00000000'),
      u_colors: colorVecs,
      u_colorsCount: colorsRaw.length,
      u_softness: 0,
      u_intensity: 0.55,
      u_noise: 0.11,
      u_shape: GrainGradientShapes.corners,
      u_scale: 0.02,
      u_rotation: -360,
      u_offsetX: -1,
      u_offsetY: -1,
    };

    const wrapper = document.getElementById('grain-overlay');
    const mount = () => new ShaderMount(wrapper, grainGradientFragmentShader, uniforms, undefined, 1.7, 48773.971);

    if (noiseTexture.complete) mount();
    else noiseTexture.addEventListener('load', mount, { once: true });
  </script>

</body>
</html>
